services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vmeste
      POSTGRES_USER: vmeste
      POSTGRES_PASSWORD: vmeste
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vmeste -d vmeste']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vmeste-postgres:/var/lib/postgresql/data

volumes:
  vmeste-postgres:
