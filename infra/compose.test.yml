name: vmeste-test

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.test}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  media-init:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: runtime
    image: vmeste-api:test
    user: '0:0'
    restart: 'no'
    entrypoint:
      - sh
      - -ec
      - mkdir -p /var/lib/vmeste/media && chown -R node:node /var/lib/vmeste/media
    volumes:
      - media-data:/var/lib/vmeste/media
    networks:
      - backend

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: runtime
    image: vmeste-api:test
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      DATABASE_URL: 'postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.test}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.test}?schema=public'
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      MEDIA_ROOT: /var/lib/vmeste/media
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - media-data:/var/lib/vmeste/media
    networks:
      - frontend
      - backend

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?Set API_HOST in .env.test}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: migration
    image: vmeste-api-ops:test
    profiles: ['ops']
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.test}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.test}?schema=public'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  seed-catalog:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: migration
    image: vmeste-api-ops:test
    profiles: ['ops']
    command: ['pnpm', '--filter', '@vmeste/api', 'db:seed:catalog']
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.test}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.test}?schema=public'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  caddy-config:
  caddy-data:
  media-data:
  postgres-data:
